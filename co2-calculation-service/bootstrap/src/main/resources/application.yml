spring:
  application:
    name: co2-calculation-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8092}

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:gbpmruntime}
    password: ${RABBITMQ_PASSWORD:gbpmruntime}

gbpmruntime:
  messaging:
    calculation-request:
      exchange-name: ${GBPMRUNTIME_CALCULATION_REQUEST_EXCHANGE:gbpmruntime.observation.events}
      routing-key: ${GBPMRUNTIME_CALCULATION_REQUEST_ROUTING_KEY:kei.calculation.requested}
      queue-name: ${GBPMRUNTIME_CALCULATION_REQUEST_QUEUE:gbpmruntime.co2-calculation.kei-calculation-requested}
    calculation-result:
      exchange-name: ${GBPMRUNTIME_CALCULATION_RESULT_EXCHANGE:gbpmruntime.calculation.events}
      routing-key: ${GBPMRUNTIME_CALCULATION_RESULT_ROUTING_KEY:kei.calculation.completed}
