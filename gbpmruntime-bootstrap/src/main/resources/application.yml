spring:
  application:
    name: gbpmruntime
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:gbpmruntime}
    password: ${RABBITMQ_PASSWORD:gbpmruntime}

gbpmruntime:
  observation:
    messaging:
      engine-events:
        queue-name: ${GBPMRUNTIME_OBSERVATION_ENGINE_EVENTS_QUEUE:gbpmruntime.observation.engine-task-completed}
        bindings:
          - exchange-name: ${CAMUNDA8_ENGINE_TASK_COMPLETED_EXCHANGE:gbpmruntime.camunda8.events}
            routing-key: ${CAMUNDA8_ENGINE_TASK_COMPLETED_ROUTING_KEY:engine.task.completed}
      kei-observation-events:
        exchange-name: ${GBPMRUNTIME_KEI_OBSERVATION_EXCHANGE:gbpmruntime.observation.events}
        observation-created-routing-key: ${GBPMRUNTIME_KEI_OBSERVATION_ROUTING_KEY:kei.observation.created}
        calculation-requested-routing-key: ${GBPMRUNTIME_KEI_CALCULATION_REQUESTED_ROUTING_KEY:kei.calculation.requested}

camunda8-integration:
  url: ${CAMUNDA8_INTEGRATION_URL:http://localhost:8090}

monitoring-results-service:
  url: ${MONITORING_RESULTS_SERVICE_URL:http://localhost:8094}
