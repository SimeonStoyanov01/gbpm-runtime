name: runtime-runtime-local

services:
  process-registry:
    build:
      context: ../../../process-registry-service
      dockerfile: Dockerfile
    container_name: process-registry-service
    ports:
      - "8080:8080"
    environment:
      PROCESS_REGISTRY_PORT: 8080
      CAMUNDA8_INTEGRATION_URL: http://camunda-8-integration:8090
      MONITORING_RESULTS_SERVICE_URL: http://monitoring-results-service:8094
    depends_on:
      - monitoring-results-service
    networks:
      - runtime-local

  mock-operational-service:
    build:
      context: ../../../mock-operational-service
      dockerfile: Dockerfile
    container_name: mock-operational-service
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: 8091
    networks:
      - runtime-local

  observation:
    build:
      context: ../../../observation-service
      dockerfile: Dockerfile
    container_name: observation-service
    environment:
      PROCESS_REGISTRY_URL: http://process-registry:8080
      RABBITMQ_HOST: runtime-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: runtime
      RABBITMQ_PASSWORD: runtime
      CAMUNDA8_ENGINE_TASK_COMPLETED_EXCHANGE: runtime.camunda8.events
      CAMUNDA8_ENGINE_TASK_COMPLETED_ROUTING_KEY: engine.task.completed
    depends_on:
      - process-registry
    networks:
      - runtime-local

  co2-calculation-service:
    build:
      context: ../../../co2-calculation-service
      dockerfile: Dockerfile
    container_name: co2-calculation-service
    ports:
      - "8092:8092"
    environment:
      SERVER_PORT: 8092
      RABBITMQ_HOST: runtime-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: runtime
      RABBITMQ_PASSWORD: runtime
      CO2_CALCULATION_DATASOURCE_URL: jdbc:postgresql://co2-calculation-postgres:5432/co2_calculation
      CO2_CALCULATION_DATASOURCE_USERNAME: co2_calculation
      CO2_CALCULATION_DATASOURCE_PASSWORD: co2_calculation
    networks:
      - runtime-local

  kei-evaluation-service:
    build:
      context: ../../../kei-evaluation-service
      dockerfile: Dockerfile
    container_name: kei-evaluation-service
    ports:
      - "8093:8093"
    environment:
      SERVER_PORT: 8093
      RABBITMQ_HOST: runtime-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: runtime
      RABBITMQ_PASSWORD: runtime
    networks:
      - runtime-local

  monitoring-results-service:
    build:
      context: ../../../monitoring-results-service
      dockerfile: Dockerfile
    container_name: monitoring-results-service
    ports:
      - "8094:8094"
    environment:
      MONITORING_RESULTS_SERVICE_PORT: 8094
      RABBITMQ_HOST: runtime-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: runtime
      RABBITMQ_PASSWORD: runtime
      MONITORING_RESULTS_DATASOURCE_URL: jdbc:postgresql://monitoring-results-postgres:5432/monitoring_results
      MONITORING_RESULTS_DATASOURCE_USERNAME: monitoring_results
      MONITORING_RESULTS_DATASOURCE_PASSWORD: monitoring_results
    networks:
      - runtime-local

networks:
  runtime-local:
    external: true
