spring:
  application:
    name: camunda-8-integration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:gbpmruntime}
    password: ${RABBITMQ_PASSWORD:gbpmruntime}

camunda:
  client:
    mode: self-managed
    auth:
      method: none
    rest-address: ${CAMUNDA_REST_ADDRESS:http://localhost:8088}
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:http://localhost:26500}

camunda8integration:
  messaging:
    engine-task-completed:
      exchange-name: ${CAMUNDA8_ENGINE_TASK_COMPLETED_EXCHANGE:gbpmruntime.camunda8.events}
      routing-key: ${CAMUNDA8_ENGINE_TASK_COMPLETED_ROUTING_KEY:engine.task.completed}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
