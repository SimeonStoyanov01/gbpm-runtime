services:
  camunda-8-integration:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: camunda-8-integration
    ports:
      - "8090:8080"
    environment:
      SERVER_PORT: 8080
      CAMUNDA_REST_ADDRESS: http://host.docker.internal:8088
      CAMUNDA_GRPC_ADDRESS: http://host.docker.internal:26500
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: gbpmruntime
      RABBITMQ_PASSWORD: gbpmruntime
      CAMUNDA8_ENGINE_TASK_COMPLETED_EXCHANGE: gbpmruntime.camunda8.events
      CAMUNDA8_ENGINE_TASK_COMPLETED_ROUTING_KEY: engine.task.completed
    extra_hosts:
      - "host.docker.internal:host-gateway"
