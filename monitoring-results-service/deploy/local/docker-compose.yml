name: monitoring-results-local

services:
  postgres:
    image: postgres:16
    container_name: monitoring-results-postgres
    environment:
      POSTGRES_DB: monitoring_results
      POSTGRES_USER: monitoring_results
      POSTGRES_PASSWORD: monitoring_results
    ports:
      - "5434:5432"
    volumes:
      - monitoring-results-postgres-data:/var/lib/postgresql/data

volumes:
  monitoring-results-postgres-data:
